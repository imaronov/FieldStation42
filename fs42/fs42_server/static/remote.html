<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
		/>
		<title>Remote Control - FieldStation42</title>
		<link
			rel="stylesheet"
			href="https://unpkg.com/purecss@3.0.0/build/pure-min.css"
		/>
		<link
			rel="stylesheet"
			href="https://unpkg.com/purecss@3.0.0/build/grids-responsive-min.css"
		/>
		<link rel="stylesheet" id="theme-css" href="/static/themes/default.css" />
		<style>
			@font-face {
				font-family: 'DSEG14 Classic Mini';
				src:
					local('DSEG14 Classic Mini Regular'),
					local('DSEG14ClassicMini-Regular'),
					url('/static/fonts/DSEG14ClassicMini-Regular.ttf') format('truetype');
				font-display: swap;
			}
			#remote-display,
			.playback-timeline-values {
				font-family: 'DSEG14 Classic Mini', 'Courier New', monospace;
			}
			#remote-display {
				background: #9caf4a;
				color: #182214;
				text-shadow: none;
			}
			.remote-display-readout {
				display: grid;
				min-width: 0;
				white-space: pre-wrap;
				overflow-wrap: anywhere;
			}
			.remote-display-readout > span,
			.remote-display-readout.has-segments::before {
				grid-area: 1 / 1;
			}
			.remote-display-readout.has-segments::before {
				content: attr(data-unlit) / '';
			}
			.remote-display-readout.has-segments::before,
			.remote-display-fill::before {
				color: rgba(24, 34, 20, 0.12);
				pointer-events: none;
			}
			.remote-display-fill {
				position: relative;
				flex: 1 1 0;
				min-width: 0;
				align-self: stretch;
				overflow: hidden;
				pointer-events: none;
			}
			.remote-display-fill::before {
				content: attr(data-unlit);
				position: absolute;
				top: 50%;
				left: 0;
				transform: translateY(-50%);
				white-space: nowrap;
			}
			.remote-display-fill:first-child::before {
				right: 0;
				left: auto;
			}
			html,
			body {
				touch-action: manipulation;
				-webkit-text-size-adjust: 100%;
			}
			.remote-btn,
			button {
				touch-action: manipulation;
			}
			.restart-overlay {
				position: fixed;
				inset: 0;
				z-index: 10000;
				display: none;
				align-items: center;
				justify-content: center;
				padding: 20px;
				background: rgba(0, 0, 0, 0.78);
			}
			.restart-overlay.is-visible {
				display: flex;
			}
			.restart-modal {
				width: min(360px, 100%);
				padding: 28px 24px;
				border: 2px solid #4caf50;
				border-radius: 12px;
				background: #171717;
				color: #fff;
				text-align: center;
				box-shadow: 0 12px 40px rgba(0, 0, 0, 0.65);
			}
			.restart-spinner {
				width: 38px;
				height: 38px;
				margin: 0 auto 18px;
				border: 4px solid rgba(255, 255, 255, 0.25);
				border-top-color: #4caf50;
				border-radius: 50%;
				animation: restart-spin 0.8s linear infinite;
			}
			@keyframes restart-spin {
				to {
					transform: rotate(360deg);
				}
			}
			.restart-modal h2 {
				margin: 0 0 10px;
				font-size: 20px;
			}
			.restart-modal p {
				margin: 0;
				color: #ddd;
			}
			.remote-header .restart-btn {
				background: linear-gradient(145deg, #168a35, #0c6424);
				color: #eaffec;
			}
			.remote-header .restart-btn:hover {
				background: linear-gradient(145deg, #20a344, #11772d);
			}
			.remote-icon {
				display: inline-block;
				width: 22px;
				height: 22px;
				vertical-align: middle;
			}
			.remote-header .power-btn {
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 3px;
				line-height: 1;
			}
			.remote-header .power-btn .remote-icon {
				width: 18px;
				height: 18px;
				flex-shrink: 0;
			}
			.button-grid.volume-channel-section {
				grid-template-rows: auto;
				align-items: start;
			}
			.remote-control-column {
				display: grid;
				gap: inherit;
				justify-items: center;
				padding: 10px;
				border-radius: 12px;
				box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.25);
			}
			.remote-control-label {
				font-size: 11px;
				font-weight: 700;
				letter-spacing: 0.06em;
			}
			.station-picker {
				--station-picker-accent: #61afef;
				box-sizing: border-box;
				width: min(340px, calc(100% - 24px));
				padding: 14px;
				border: 1px solid #666;
				border-radius: 12px;
				background: #222;
				color: #fff;
			}
			.station-picker::backdrop {
				background: rgba(0, 0, 0, 0.65);
			}
			.station-picker-header {
				display: flex;
				justify-content: space-between;
				align-items: center;
				gap: 12px;
			}
			.station-picker-header h2 {
				margin: 0;
				font-size: 18px;
				color: var(--station-picker-accent);
			}
			.station-picker-list {
				display: grid;
				grid-template-columns: repeat(2, minmax(0, 1fr));
				grid-auto-rows: max-content;
				align-content: start;
				gap: 6px;
				max-height: 55vh;
				overflow: auto;
				margin: 10px 0 0;
				min-inline-size: 0;
				padding: 2px;
				border: 0;
			}
			.station-picker-list .function-btn {
				box-sizing: border-box;
				display: block;
				width: 100%;
				min-width: 0;
				height: auto;
				min-height: 44px;
				font-size: 12px;
				line-height: 1.3;
				text-align: left;
				white-space: normal;
				overflow-wrap: anywhere;
			}
			#media-track-picker-list {
				grid-template-columns: minmax(0, 1fr);
			}
			.subtitle-style-options {
				display: grid;
				grid-template-columns: repeat(2, minmax(0, 1fr));
				gap: 12px;
				margin: 10px 0;
				padding: 0;
				border: 0;
				min-inline-size: 0;
			}
			.subtitle-style-options[hidden] {
				display: none;
			}
			.subtitle-style-options label,
			.subtitle-position-picker {
				display: grid;
				gap: 4px;
				min-width: 0;
				font-size: 13px;
			}
			.subtitle-style-options select {
				box-sizing: border-box;
				width: 100%;
				min-width: 0;
				min-height: 32px;
				margin: 0;
			}
			.subtitle-position-buttons {
				display: grid;
				grid-template-columns: repeat(3, minmax(0, 1fr));
				gap: 3px;
			}
			.subtitle-position-buttons .pure-button {
				min-height: 32px;
				padding: 2px;
				font-size: 11px;
			}
			.subtitle-position-buttons button[aria-pressed='true'] {
				background: var(--station-picker-accent);
				color: #111;
			}
			.station-picker-list .function-btn > span {
				display: block;
			}
			.station-picker-channel {
				margin-bottom: 3px;
				font-size: 15px;
				font-variant-numeric: tabular-nums;
			}
			.station-picker-list button[aria-current='true'] {
				background: var(--station-picker-accent);
				border-color: var(--station-picker-accent);
				color: #111;
				text-shadow: none;
			}
			#playback-controls {
				display: grid !important;
				grid-column: 1 / -1;
				grid-template-columns: repeat(4, minmax(0, 1fr)) !important;
				grid-auto-flow: column;
				width: 100%;
				max-width: 280px;
				justify-self: center;
				margin-bottom: 0;
			}
			#playback-controls > .remote-btn {
				box-sizing: border-box;
				width: min(48px, 100%);
				min-width: 0;
				height: 48px;
				min-height: 0;
				justify-self: center;
			}
			#remote-typing-input {
				position: fixed;
				left: 8px;
				bottom: 8px;
				z-index: 2;
				width: 2px;
				height: 2px;
				padding: 0;
				border: 0;
				opacity: 0.01;
				font-size: 16px;
			}
			.nav-pad .remote-keyboard-btn {
				grid-column: 3;
				grid-row: 3;
			}
			.nav-pad .nav-back {
				grid-column: 1;
				grid-row: 1;
				font-size: 11px;
			}
			.playback-step-label {
				display: block;
				font-size: 10px;
				line-height: 1;
			}
			.playback-timeline {
				box-sizing: border-box;
				width: min(320px, calc(100% - 32px));
				margin: 4px auto 14px;
				padding: 0 8px;
			}
			.playback-timeline[hidden] {
				display: none !important;
			}
			.playback-timeline-values {
				display: grid;
				grid-template-columns: 1fr auto 1fr;
				align-items: baseline;
				margin-top: -8px;
				margin-bottom: 3px;
				font-variant-numeric: tabular-nums;
			}
			.playback-timeline-values > div:first-child {
				justify-self: start;
			}
			.playback-timeline-values > div:nth-child(2) {
				justify-self: center;
			}
			.playback-timeline-values > div:last-child {
				justify-self: end;
			}
			.playback-timeline-values > div > span {
				font-size: 11px;
				line-height: 1;
			}
			.playback-timeline-values #timeline-current {
				color: #8be39a;
				font-weight: 600;
			}
			#playback-timeline-slider {
				--progress: 0%;
				box-sizing: border-box;
				display: block;
				width: 100%;
				min-width: 0;
				max-width: none;
				height: 18px;
				margin: 0;
				padding: 0 !important;
				appearance: none;
				-webkit-appearance: none;
				background: transparent !important;
				pointer-events: none;
				opacity: 1;
				border: 0;
				border-radius: 0;
				outline: 0;
			}
			#playback-timeline-slider::-webkit-slider-runnable-track {
				height: 3px;
				border-radius: 999px;
				background: linear-gradient(
					to right,
					#4caf50 var(--progress),
					rgba(255, 255, 255, 0.2) var(--progress)
				);
			}
			#playback-timeline-slider::-moz-range-track {
				height: 3px;
				border-radius: 999px;
				background: linear-gradient(
					to right,
					#4caf50 var(--progress),
					rgba(255, 255, 255, 0.2) var(--progress)
				);
			}
			#playback-timeline-slider::-webkit-slider-thumb {
				width: 2px;
				height: 13px;
				appearance: none;
				-webkit-appearance: none;
				border: 0;
				border-radius: 2px;
				margin-top: -5px;
				background: #f4fff5;
				box-shadow: 0 0 4px rgba(76, 175, 80, 0.65);
			}
			#playback-timeline-slider::-moz-range-thumb {
				width: 2px;
				height: 13px;
				border: 0;
				border-radius: 2px;
				background: #f4fff5;
				box-shadow: 0 0 4px rgba(76, 175, 80, 0.65);
			}
			@media (max-width: 360px) {
				#playback-controls {
					gap: 4px;
				}
				#playback-controls > .remote-btn {
					width: min(42px, 100%);
					height: 42px;
				}
			}
			html:has(.remote-container[data-layout='mobile']) {
				background: var(--retro-surface, #2a2a2a);
			}
			body:has(.remote-container[data-layout='mobile']) {
				background: transparent;
				margin: 0;
				min-height: 0;
			}
			.remote-container[data-layout='mobile'] {
				background: transparent;
				box-shadow: none;
			}
			.remote-container[data-layout='mobile'] .now-playing {
				background: #000;
			}
			.remote-container[data-layout='mobile'] {
				box-sizing: border-box;
				display: grid;
				grid-template-columns: minmax(0, 1fr);
				grid-template-areas:
					'header'
					'screen'
					'pad'
					'controls'
					'playing'
					'functions';
				grid-template-rows: auto auto minmax(min-content, 1fr) auto auto auto;
				align-items: start;
				gap: 8px;
				width: 100%;
				max-width: none;
				min-height: 100vh;
				min-height: 100dvh;
				border: 0;
				border-radius: 0;
				margin: 0 auto;
				padding: max(8px, env(safe-area-inset-top))
					max(8px, env(safe-area-inset-right))
					max(8px, env(safe-area-inset-bottom))
					max(8px, env(safe-area-inset-left));
			}
			.remote-container {
				position: relative;
				isolation: isolate;
			}
			.remote-container > .remote-brand {
				position: absolute;
				inset: 0;
				z-index: -1;
				display: grid;
				place-items: start center;
				padding-top: max(8px, env(safe-area-inset-top));
				font-size: clamp(24px, 7vw, 36px);
				text-align: center;
				text-shadow: none;
				opacity: 0.2;
				pointer-events: none;
			}
			.remote-layout-picker {
				position: relative;
				top: 10px;
				display: flex;
				flex: 1;
				min-width: 0;
				align-items: center;
				justify-content: center;
				gap: 10px;
				min-height: 44px;
				cursor: pointer;
				font-size: 10px;
				text-align: center;
				white-space: nowrap;
			}
			.remote-layout-picker input {
				position: absolute;
				opacity: 0;
			}
			.remote-layout-track {
				box-sizing: border-box;
				position: relative;
				flex: 0 0 30px;
				height: 17px;
				border: 1px solid #61afef;
				border-radius: 999px;
				background: #222;
			}
			.remote-layout-track::before {
				content: '';
				position: absolute;
				top: 2px;
				left: 2px;
				width: 11px;
				height: 11px;
				border-radius: 50%;
				background: #61afef;
			}
			.remote-layout-picker input:checked + .remote-layout-track::before {
				transform: translateX(13px);
			}
			.remote-layout-picker input:focus-visible + .remote-layout-track {
				outline: 2px solid #61afef;
				outline-offset: 2px;
			}
			.remote-container .remote-header .power-btn {
				width: 64px;
				min-width: 0;
				padding-inline: 2px;
				font-size: 10px;
			}
			.remote-container[data-layout='mobile']
				> :is(.remote-header, .remote-screen, .button-grid, .now-playing) {
				box-sizing: border-box;
				width: 100%;
				min-width: 0;
				max-width: none;
				margin: 0;
			}
			.remote-container[data-layout='mobile'] .remote-header {
				grid-area: header;
			}
			.remote-container[data-layout='mobile'] .remote-screen {
				grid-area: screen;
				padding: 6px;
				min-height: 32px;
			}
			.remote-container[data-layout='mobile'] :is(.number-pad, .nav-pad) {
				grid-area: pad;
				align-self: stretch;
				align-content: space-evenly;
				gap: 6px;
			}
			.remote-container > [hidden] {
				display: none !important;
			}
			.remote-container[data-layout='mobile'] .volume-channel-section {
				grid-area: controls;
				grid-template-columns: repeat(2, minmax(0, 1fr));
				justify-items: stretch;
				gap: 6px;
			}
			.remote-container[data-layout='mobile'] .function-section {
				grid-area: functions;
				grid-template-columns: repeat(3, minmax(0, 1fr));
				gap: 6px;
			}
			.remote-container[data-layout='mobile'] .now-playing {
				grid-area: playing;
				padding: 6px 8px;
				overflow-wrap: anywhere;
			}
			.remote-container[data-layout='mobile'] .now-playing-label {
				margin-bottom: 4px;
			}
			.remote-container[data-layout='mobile'] .playback-timeline {
				margin-bottom: 0;
			}
			.remote-container[data-layout='mobile'] .remote-control-column {
				grid-template-columns: repeat(3, minmax(0, 1fr));
				gap: 3px;
				min-width: 0;
				padding: 4px;
			}
			.remote-container[data-layout='mobile'] .remote-control-label {
				grid-column: 1 / -1;
			}
			.remote-container[data-layout='mobile'] [data-key='mute'] {
				order: 1;
			}
			.remote-container[data-layout='mobile'] [data-key='vol_down'] {
				order: 2;
			}
			.remote-container[data-layout='mobile'] [data-key='vol_up'] {
				order: 3;
			}
			.remote-container[data-layout='mobile'] .remote-btn {
				box-sizing: border-box;
				min-width: 0;
				min-height: 44px;
				height: 44px;
				padding: 4px;
			}
			.remote-container[data-layout='mobile']
				:is(.function-btn, .volume-btn, .channel-btn) {
				width: 100%;
			}
			.remote-container[data-layout='mobile'] :is(.number-btn, .nav-btn) {
				--pad-button-size: clamp(48px, 7.5dvh, 68px);
				width: var(--pad-button-size);
				height: var(--pad-button-size);
				border-radius: 30%;
				font-size: 16px;
			}
			.remote-container[data-layout='mobile'] #previous-channel {
				font-size: 10px;
			}
			.remote-container[data-layout='mobile'] #playback-controls {
				margin: 0;
				gap: 4px;
			}
			.remote-container[data-layout='mobile'] #playback-controls > .remote-btn {
				height: 44px;
			}
			@media (max-height: 720px) {
				.remote-container[data-layout='mobile'] {
					gap: 4px;
				}
				.remote-container[data-layout='mobile'] :is(.number-pad, .nav-pad) {
					gap: 4px;
				}
			}
		</style>
	</head>

	<body>
		<div
			class="restart-overlay"
			id="restart-overlay"
			aria-hidden="true"
			aria-modal="true"
			role="dialog"
			aria-labelledby="restart-modal-title"
		>
			<div class="restart-modal">
				<div class="restart-spinner" aria-hidden="true"></div>
				<h2 id="restart-modal-title">Restarting fs42.service</h2>
				<p id="restart-modal-message">Waiting for the Web UI to return…</p>
			</div>
		</div>
		<script src="/static/common.js"></script>
		<script src="/static/fs42_client.js"></script>
		<script>
			// Initialize theme
			document.addEventListener('DOMContentLoaded', function () {
				window.fs42Common.initTheme();
			});
		</script>
		<div class="remote-container" id="remote-container" data-layout="desktop">
			<div class="remote-brand">FieldStation42</div>
			<div class="remote-header">
				<button class="remote-btn power-btn" data-key="services_shutdown">
					<svg
						class="remote-icon"
						viewBox="0 0 24 24"
						fill="none"
						stroke="currentColor"
						stroke-width="2"
						stroke-linecap="round"
						aria-hidden="true"
					>
						<path d="M12 3v9M7 6a8 8 0 1 0 10 0" />
					</svg>
					<span>POWER OFF</span>
				</button>
				<label class="remote-layout-picker">
					<span>Mobile</span>
					<input
						type="checkbox"
						id="remote-layout"
						role="switch"
						aria-label="Use desktop layout"
						checked
					/>
					<span class="remote-layout-track" aria-hidden="true"></span>
					<span>Desktop</span>
				</label>
				<button
					class="remote-btn power-btn restart-btn"
					data-key="services_restart"
				>
					<svg
						class="remote-icon"
						viewBox="0 0 24 24"
						fill="none"
						stroke="currentColor"
						stroke-width="2"
						stroke-linecap="round"
						stroke-linejoin="round"
						aria-hidden="true"
					>
						<path d="M4 11a8 8 0 1 1 2 6M4 5v6h6" />
					</svg>
					<span>RESTART</span>
				</button>
			</div>

			<div class="remote-screen" id="remote-display">
				<span class="remote-display-fill" aria-hidden="true"></span>
				<span class="remote-display-readout"
					><span id="remote-display-text">Ready</span></span
				>
				<span class="remote-display-fill" aria-hidden="true"></span>
			</div>

			<!-- Number Pad -->
			<div class="button-grid number-pad" id="number-pad">
				<button class="remote-btn number-btn" data-key="1">1</button>
				<button class="remote-btn number-btn" data-key="2">2</button>
				<button class="remote-btn number-btn" data-key="3">3</button>
				<button class="remote-btn number-btn" data-key="4">4</button>
				<button class="remote-btn number-btn" data-key="5">5</button>
				<button class="remote-btn number-btn" data-key="6">6</button>
				<button class="remote-btn number-btn" data-key="7">7</button>
				<button class="remote-btn number-btn" data-key="8">8</button>
				<button class="remote-btn number-btn" data-key="9">9</button>
				<button
					class="remote-btn number-btn pad-toggle-btn"
					data-key="pad_toggle"
					aria-label="Show navigation pad"
					title="Show navigation pad"
				>
					<svg
						class="remote-icon"
						viewBox="0 0 24 24"

		<script>
			const remoteContainer = document.getElementById('remote-container');
			const remoteLayout = document.getElementById('remote-layout');
			const remoteLayoutKey = 'fs42-remote-layout';
			const phoneViewport = window.matchMedia(
				'(max-width: 639px), (max-width: 1000px) and (pointer: coarse)',
			);

			let initialLayout = phoneViewport.matches ? 'mobile' : 'desktop';
			try {
				const savedLayout = localStorage.getItem(remoteLayoutKey);
				if (['mobile', 'iphone-17', 'iphone-air'].includes(savedLayout)) {
					initialLayout = 'mobile';
				} else if (savedLayout === 'desktop') {
					initialLayout = 'desktop';
				}
			} catch {
				// The layout remains available when browser storage is disabled.
			}
			remoteLayout.checked = initialLayout === 'desktop';
			remoteContainer.dataset.layout = initialLayout;
			remoteLayout.addEventListener('change', () => {
				const layout = remoteLayout.checked ? 'desktop' : 'mobile';
				remoteContainer.dataset.layout = layout;
				try {
					localStorage.setItem(remoteLayoutKey, layout);
				} catch {
					// Keep the current selection for this page.
				}
			});

			// Basic remote control functionality
			const display = document.getElementById('remote-display-text');
			const displayReadout = display.parentElement;
			function updateUnlitSegments() {
				displayReadout.dataset.unlit = display.textContent.replace(
					/[a-z0-9]/gi,
					'~',
				);
			}
			updateUnlitSegments();
			new MutationObserver(updateUnlitSegments).observe(display, {
				childList: true,
				characterData: true,
				subtree: true,
			});
			document.fonts.load('14px "DSEG14 Classic Mini"', '~').then(
				(fonts) => {
					if (!fonts.length) return;
					displayReadout.classList.add('has-segments');
					for (const fill of displayReadout.parentElement.querySelectorAll(
						'.remote-display-fill',
					)) {
						fill.dataset.unlit = '~'.repeat(80);
					}
				},
				() => {},
			);
			const nowPlayingNetwork = document.getElementById('now-playing-network');
			const nowPlayingStatus = document.getElementById('now-playing-status');
			const nowPlayingTitle = document.getElementById('now-playing-title');
			let currentChannel = null;
			let previousChannelAvailable = false;
			let tuningPreviousChannel = false;
			const previousChannelButton = document.getElementById('previous-channel');
			let volume = 50;
			let muted = false;
			let statusPollInterval = null;
			let channelInput = '';
			let channelInputTimeout = null;
			let isInputtingChannel = false;
			let volumeDisplayTimeout = null;
			let isShowingVolume = false;
			let isShowingInfo = false;
			let infoMode = 'playing'; // 'playing' or 'system'
			let padMode = 'number'; // 'number' or 'nav'
			// Mirrors the player status: while a station is locked, digits enter the
			// PIN instead of changing channel (same rule as fs42/pi/remote_controller.py).
			let awaitingPin = false;
			let pinDigitsEntered = 0;

			const numberPad = document.getElementById('number-pad');
			const navPad = document.getElementById('nav-pad');
			const playbackControls = document.getElementById('playback-controls');
			const remoteTypingInput = document.getElementById('remote-typing-input');
			let lastRemoteTypingValue = '';
			let remoteTypingQueue = Promise.resolve();
			function remoteKeyForCharacter(character) {
				const specialKeys = {
					' ': 'Space',
					"'": 'Apostrophe',
					',': 'Comma',
					'-': 'Hyphen',
					'.': 'Period',
					'/': 'Slash',
					':': 'Colon',
					';': 'Semicolon',
					'?': 'Question',
					'!': 'Exclamation',
				};
				if (specialKeys[character]) return specialKeys[character];
				if (/^[a-z0-9]$/i.test(character)) return character.toUpperCase();
				return null;
			}
			remoteTypingInput.addEventListener('focus', () => {
				lastRemoteTypingValue = remoteTypingInput.value;
			});
			remoteTypingInput.addEventListener('input', () => {
				const value = remoteTypingInput.value;
				let prefixLength = 0;
				while (
					prefixLength < lastRemoteTypingValue.length &&
					prefixLength < value.length &&
					lastRemoteTypingValue[prefixLength] === value[prefixLength]
				)
					prefixLength++;
				const toSend = [];
				for (let i = prefixLength; i < lastRemoteTypingValue.length; i++)
					toSend.push('Backspace');
				for (const character of value.slice(prefixLength)) {
					const keyName = remoteKeyForCharacter(character);
					if (keyName) toSend.push(keyName);
				}
				lastRemoteTypingValue = value;
				if (!toSend.length) return;
				remoteTypingQueue = remoteTypingQueue
					.then(async () => {
						for (const keyName of toSend) {
							await window.fs42Api.post(`player/web/key/${keyName}`);
						}
					})
					.catch((error) => {
						console.error('Text input failed:', error);
						display.textContent = 'TYPE ERROR';
					});
			});
			const stationPpvCache = new Map();
			let ppvVideoPlaying = false;
			let ppvVideoPaused = false;
			let observedPpvVideoPath = null;

			// Sample program data (could be fetched from API later)
			const programData = {
				'001': { title: 'Morning News', info: 'Local and world news updates' },
				'002': { title: 'Classic Movies', info: 'The Maltese Falcon (1941)' },
				'003': { title: 'Nature Documentary', info: 'Wildlife of the Amazon' },
				'004': { title: 'Cooking Show', info: 'Italian Pasta Masterclass' },
				'005': { title: 'Sitcom Reruns', info: 'Comedy Hour Marathon' },
			};

			function updateNowPlaying(channel) {
				const program = programData[channel];
				if (program) {
					nowPlayingTitle.textContent = program.title;
					nowPlayingInfo.textContent = program.info;
				} else {
					nowPlayingTitle.textContent = `Channel ${channel}`;
					nowPlayingInfo.textContent = 'Program information unavailable';
				}
			}

			// What the display falls back to whenever nothing transient is showing.
			function idleDisplayText() {
				if (awaitingPin) {
					return pinDigitsEntered > 0
						? '•'.repeat(pinDigitsEntered)
						: 'ENTER PIN';
				}
				if (muted) return 'MUTE';
				return `CH ${currentChannel ?? '001'}`;
			}

			function muteStateFromResponse(response, fallback = muted) {
				if (typeof response?.muted === 'boolean') return response.muted;
				const statusText =
					`${response?.volume || ''} ${response?.message || ''}`.toUpperCase();
				if (statusText.includes('MUTED') || statusText.includes('MUTE ON'))
					return true;
				if (statusText.includes('MUTE OFF')) return false;
				if (/\d+(?:\.\d+)?%/.test(statusText)) return false;
				return fallback;
			}

			function updateNowPlayingFromStatus(status) {
				awaitingPin = !!status.awaiting_pin;
				pinDigitsEntered = status.pin_digits_entered || 0;
				previousChannelAvailable = status.previous_channel_available === true;
				if (status.status === 'playing' && status.channel_number > 0) {
					currentChannel = String(status.channel_number).padStart(3, '0');
				}
				updatePreviousChannelButton();

				if (infoMode === 'playing') {
					if (status.status === 'playing') {
						// Top line: "Playing"
						nowPlayingNetwork.textContent = 'Playing';
						// Second line: network_name
						nowPlayingStatus.textContent = status.network_name || '';
						// Third line: title
						nowPlayingTitle.textContent = status.title || '';

						// Update channel display and current channel to match actual channel
						// BUT only if we're not currently inputting a channel number or showing volume
						if (status.channel_number && status.channel_number > 0) {
							if (!isInputtingChannel && !isShowingVolume) {
								display.textContent = idleDisplayText();
							}
						}
					} else if (status.status === 'stopped') {
						nowPlayingNetwork.textContent = 'Stopped';
						nowPlayingStatus.textContent = '';
						nowPlayingTitle.textContent = '';
						if (!isInputtingChannel && !isShowingVolume) {
							display.textContent = 'STOPPED';
						}
					} else if (status.status === 'idle') {
						// The player hands back from parental controls as 'idle' and
						// starts playing a moment later - a transition, not a fault.
						nowPlayingNetwork.textContent = 'Ready';
						nowPlayingStatus.textContent = status.network_name || '';
						nowPlayingTitle.textContent = '';
						if (!isInputtingChannel && !isShowingVolume) {
							display.textContent = idleDisplayText();
						}
					} else {
						nowPlayingNetwork.textContent = status.status || 'Unknown';
						nowPlayingStatus.textContent = '';
						nowPlayingTitle.textContent = '';
						if (!isInputtingChannel && !isShowingVolume) {
							display.textContent = 'ERROR';
						}
					}
				}
				if (muted && !isInputtingChannel && !isShowingVolume) {
					display.textContent = 'MUTE';
				}
				// If in system info mode, don't update the display from player status
			}

			function updateSystemInfo(info) {
				// Prioritize: CPU temp, CPU load percent, memory used percent
				console.log('System info received:', info);

				// Top line: CPU Temperature
				if (info.temperature_c !== undefined) {
					nowPlayingNetwork.textContent = `CPU ${info.temperature_c}°C (${info.temperature_f}°F)`;
				} else if (info.temperature_f !== undefined) {
					nowPlayingNetwork.textContent = `CPU ${info.temperature_f}°F`;
				} else if (info.temperature === 'unavailable') {
					// WSL/virtualized environment - show system type instead
					const systemType = info.system?.platform || 'Unknown';
					const arch = info.system?.architecture || '';
					nowPlayingNetwork.textContent = `${systemType} ${arch}`.trim();
				} else {
					nowPlayingNetwork.textContent = 'CPU Temp N/A';
				}

				// Second line: CPU Load
				if (info.cpu && info.cpu.load_percent !== undefined) {
					nowPlayingStatus.textContent = `CPU Load ${info.cpu.load_percent}%`;
				} else if (info.cpu && info.cpu.load_1min !== undefined) {
					nowPlayingStatus.textContent = `Load ${info.cpu.load_1min}`;
				} else {
					nowPlayingStatus.textContent = 'CPU Load N/A';
				}

				// Third line: Memory Usage
				if (info.memory && info.memory.used_percent !== undefined) {
					nowPlayingTitle.textContent = `Memory ${info.memory.used_percent}% (${info.memory.used_gb}/${info.memory.total_gb}GB)`;
				} else {
					nowPlayingTitle.textContent = 'Memory N/A';
				}
			}

			async function pollPlayerStatus() {
				try {
					await updateMuteState();
					const status = await window.fs42Api.get('player/status');
					updateNowPlayingFromStatus(status);
					if (infoMode === 'playing') {
						console.log('Player status response:', status);
						await updatePlaybackControlVisibility(status);
						updatePlaybackToggle(status);
						updatePlaybackTimeline(status);
					} else if (infoMode === 'system') {
						setPlaybackControlsEnabled(false);
						const info = await window.fs42Api.get('player/info');
						console.log('System info response:', info);
						updateSystemInfo(info);
					}
					if (muted && !isInputtingChannel && !isShowingVolume) {
						display.textContent = 'MUTE';
					}
				} catch (error) {
					console.error('Failed to get status/info:', error);
					if (infoMode === 'playing') {
						nowPlayingNetwork.textContent = 'Unknown';
						nowPlayingStatus.textContent = '';
						nowPlayingTitle.textContent = '';
					} else {
						nowPlayingNetwork.textContent = 'System';
						nowPlayingStatus.textContent = 'Error';
						nowPlayingTitle.textContent = 'Unable to get info';
					}
				}
			}

			async function updatePlaybackControlVisibility(status) {
				const channelNumber = Number(status.channel_number);
				if (status.status !== 'playing' || !Number.isInteger(channelNumber)) {
					setPlaybackControlsEnabled(false);
					return;
				}

				if (!stationPpvCache.has(channelNumber)) {
					setPlaybackControlsEnabled(false);
					try {
						const response = await window.fs42Api.get('stations');
						const stationEntry = (response.stations || []).find((entry) => {
							const station = entry.station_conf || entry;
							return Number(station.channel_number) === channelNumber;
						});
						const station = stationEntry
							? stationEntry.station_conf || stationEntry
							: null;
						const webPath = station?.web_url
							? new URL(
									station.web_url,
									window.location.origin,
								).pathname.replace(/\/$/, '')
							: '';
						const isPpv =
							station?.network_type === 'web' &&
							(!!station.content_dir || !!station.media_browser) &&
							(webPath.endsWith('/static/ppv/ppv.html') ||
								webPath.endsWith('/static/ppv/ppv_list.html') ||
								webPath.endsWith('/static/media_browser/myflix.html'));
						stationPpvCache.set(channelNumber, isPpv);
					} catch (error) {
						console.error('Could not identify PPV channel:', error);
						stationPpvCache.set(channelNumber, false);
					}
				}

				setPlaybackControlsEnabled(stationPpvCache.get(channelNumber) === true);
			}

			function updatePlaybackToggle(status) {
				const isPpv =
					stationPpvCache.get(Number(status.channel_number)) === true;
				const filePath = status.file_path || '';
				const isVideo =
					isPpv &&
					status.status === 'playing' &&
					/\.(mp4|avi|mkv|mov|wmv|flv|webm|m4v)$/i.test(filePath);

				if (!isVideo) {
					ppvVideoPlaying = false;
					ppvVideoPaused = false;
					observedPpvVideoPath = null;
				} else {
					if (!ppvVideoPlaying || observedPpvVideoPath !== filePath) {
						ppvVideoPaused = false;
						observedPpvVideoPath = filePath;
					}
					ppvVideoPlaying = true;
				}
			}

			function formatPlaybackTime(seconds) {
				const total = Math.max(0, Math.floor(Number(seconds) || 0));
				const hours = Math.floor(total / 3600);
				const minutes = Math.floor((total % 3600) / 60);
				const remainder = total % 60;
				return hours > 0
					? hours +
							':' +
							String(minutes).padStart(2, '0') +
							':' +
							String(remainder).padStart(2, '0')
					: minutes + ':' + String(remainder).padStart(2, '0');
			}

			function updatePlaybackTimeline(status) {
				const timeline = document.getElementById('playback-timeline');
				const filePath = status.file_path || '';
				const duration = Number(status.playback_duration);
				const position = Number(status.playback_position);
				const isVideo =
					status.status === 'playing' &&
					/\.(mp4|avi|mkv|mov|wmv|flv|webm|m4v)$/i.test(filePath);

				if (!isVideo || !Number.isFinite(duration) || duration <= 0) {
					timeline.hidden = true;
					return;
				}

				const current = Math.min(
					duration,
					Math.max(0, Number.isFinite(position) ? position : 0),
				);
				const slider = document.getElementById('playback-timeline-slider');
				slider.max = String(duration);
				slider.value = String(current);
				const progress = (current / duration) * 100;
				slider.style.setProperty('--progress', progress + '%');
				document.getElementById('timeline-start').textContent =
					formatPlaybackTime(0);
				document.getElementById('timeline-current').textContent =
					formatPlaybackTime(current);
				document.getElementById('timeline-end').textContent =
					formatPlaybackTime(duration);
				timeline.hidden = false;
			}

			async function sendPpvPlaybackControl(action, label) {

			function showRestartModal(message) {
				document.getElementById('restart-modal-message').textContent = message;
				const overlay = document.getElementById('restart-overlay');
				overlay.classList.add('is-visible');

			}

			function waitForServerAndReload(previousStartedAt) {
				const deadline = Date.now() + 180000;
				const checkServer = async () => {
					if (Date.now() >= deadline) {
						hideRestartModal();
						display.textContent = 'RESTART NOT CONFIRMED';
						document
							.querySelectorAll('[data-key="services_restart"]')
							.forEach((button) => {
								button.disabled = false;
							});
						return;
					}
					try {
						const status = await window.fs42Api.get('manage/status');
						if (Number(status.started_at) > Number(previousStartedAt)) {
							const reloadUrl = new URL('/remote', window.location.origin);
							reloadUrl.searchParams.set('restart', Date.now().toString());
							const response = await fetch(reloadUrl, { cache: 'no-store' });
							if (
								response.ok &&
								(await response.text()).includes('id="remote-display"')
							) {
								window.location.replace(reloadUrl.toString());
								return;
							}
						}
					} catch {
						// The API is expected to be unavailable during its restart.
					}
					setTimeout(checkServer, 2000);
				};
				setTimeout(checkServer, 8000);
			}

			async function handleClear() {

					try {
						await window.fs42Api.post('player/parental/clear');
						pinDigitsEntered = 0;
						display.textContent = idleDisplayText();
						console.log('Parental PIN cleared');
					} catch (error) {

						display.textContent = 'ERROR';
					}
					return;
				}

				// Not locked, so drop whatever channel number is half-entered.
				if (channelInputTimeout) {

				}
				channelInput = '';

			function handleNumberInput(digit) {
				// Set input mode
				isInputtingChannel = true;

				// Clear any existing timeout
				if (channelInputTimeout) {
					clearTimeout(channelInputTimeout);
					channelInputTimeout = null;
				}

				// Add digit to input
				channelInput += digit;

				// Display the accumulated input
				display.textContent = channelInput;

				// If we have 3 digits, send immediately
				if (channelInput.length >= 3) {
					sendChannelChange();
				} else {
					// Set timeout for 1 second
					channelInputTimeout = setTimeout(sendChannelChange, 1000);
				}
			}

			async function sendChannelChange() {
				if (channelInputTimeout) {
					clearTimeout(channelInputTimeout);
					channelInputTimeout = null;
				}

				if (channelInput) {
					try {
						const channelNumber = parseInt(channelInput);
						console.log(`Sending channel change to ${channelNumber}`);
						await window.fs42Api.get(`player/channels/${channelNumber}`);
						console.log(`Changed to channel ${channelNumber}`);
						// The status polling will update the display with actual channel info
					} catch (error) {
						console.error('Channel change failed:', error);
						display.textContent = 'ERROR';
						setTimeout(() => {
							isInputtingChannel = false;
							display.textContent = idleDisplayText();
						}, 2000);
						return;
					}
				}

				// Clear the input and exit input mode
				channelInput = '';
				isInputtingChannel = false;
			}

			function showSubtitleStyle(settings) {
				subtitleStyle = settings;
				for (const button of subtitlePositionButtons) {
					button.setAttribute(
						'aria-pressed',
						String(
							Number(button.dataset.subtitlePosition) === settings.position,
						),
					);

				subtitleBackground.value = settings.background;
			}

			async function saveSubtitleStyle(setting, value) {
				if (subtitleStyleOptions.disabled || subtitleStyle[setting] === value)
					return;
				savingSubtitleStyle = true;
				subtitleStyleOptions.disabled = true;
				subtitleStyleStatus.textContent = 'Applying…';
				subtitleStyleStatus.hidden = false;
				try {
					await window.fs42Api.post(
						`${subtitleStyleEndpoint}/${setting}/${value}`,
					);
					for (let attempt = 0; attempt < 8; attempt++) {
						await new Promise((resolve) => setTimeout(resolve, 300));
						const settings = await window.fs42Api.get(subtitleStyleEndpoint);
						if (settings[setting] === value) {
							showSubtitleStyle(settings);
							subtitleStyleStatus.hidden = true;
							return;
						}
					}
					throw new Error('Could not confirm the subtitle setting.');
				} catch (error) {
					showSubtitleStyle(subtitleStyle);
					subtitleStyleStatus.textContent = error.detail || error.message;
				} finally {
					savingSubtitleStyle = false;
					subtitleStyleOptions.disabled = false;
				}
			}

			for (const button of subtitlePositionButtons) {
				button.addEventListener('click', () =>
					saveSubtitleStyle(
						'position',
						Number(button.dataset.subtitlePosition),
					),
				);
			}
			subtitleBackground.addEventListener('change', () =>
				saveSubtitleStyle('background', subtitleBackground.value),
			);

				mediaTrackPickerList.disabled = true;

						await window.fs42Api.get(endpoint);
					mediaTrackPickerStatus.textContent = tracks.length
						? ''
						: `No ${trackLabel} available.`;
					if (!tracks.length) return;
					const options = isAudio
						? tracks

					for (const track of options) {

						button.className = 'remote-btn function-btn';
						button.textContent =
							[track.language, track.title].filter(Boolean).join(' · ') ||
							`Track ${track.id}`;

							button.setAttribute('aria-current', 'true');
						button.addEventListener('click', () =>
							selectMediaTrack(endpoint, entry_id, track.id),
						);
						mediaTrackPickerList.append(button);

					if (!isAudio) {
						try {
							showSubtitleStyle(
								await window.fs42Api.get(subtitleStyleEndpoint),
							);
							subtitleStyleOptions.disabled = false;
						} catch (error) {
							subtitleStyleStatus.textContent =

					mediaTrackPickerStatus.textContent = `Could not load ${trackLabel}.`;

					mediaTrackPickerList.disabled = false;

			}

			async function selectMediaTrack(endpoint, entryId, trackId) {
				if (mediaTrackPickerList.disabled) return;
				mediaTrackPickerList.disabled = true;
				mediaTrackPickerStatus.textContent = 'Applying selection…';
				try {
					const query = trackId === null ? '' : `?track_id=${trackId}`;
					await window.fs42Api.post(`${endpoint}/${entryId}${query}`);
					for (
						let attempt = 0;
						attempt < 8 && mediaTrackPicker.open;
						attempt++
					) {
						await new Promise((resolve) => setTimeout(resolve, 300));
						if (!mediaTrackPicker.open) return;
						const { entry_id, selected_id } =
							await window.fs42Api.get(endpoint);
						if (entry_id !== entryId)
							throw new Error('Playback changed. Reopen the track picker.');
						if (selected_id === trackId) {
							mediaTrackPicker.close();
							return;
						}
					}
					mediaTrackPickerStatus.textContent =
						'Could not confirm the track selection.';
				} catch (error) {
					mediaTrackPickerStatus.textContent = error.detail || error.message;
				} finally {
					mediaTrackPickerList.disabled = false;
				}
			}

			// Button press handler
			document.querySelectorAll('.remote-btn').forEach((btn) => {
				btn.addEventListener('click', function () {
					const key = this.getAttribute('data-key');
					handleRemoteCommand(key);

					// Visual feedback
					this.style.transform = 'translateY(2px)';
					setTimeout(() => {
						this.style.transform = '';
					}, 100);
				});
			});

			async function handleRemoteCommand(key) {
				switch (key) {
					case 'stations':
						await openStationPicker();
						return;
					case 'services_shutdown':
						await shutdownSystem();
						break;
					case 'services_restart':
						await startOrRestartServices();
						break;
					case '0':
					case '1':
					case '2':
					case '3':
					case '4':
					case '5':
					case '6':
					case '7':
					case '8':
					case '9':
						if (awaitingPin) {
							await sendParentalDigit(key);
						} else {
							handleNumberInput(key);
						}
						break;
					case 'clear':
						await handleClear();
						break;
					case 'pad_toggle':
						togglePad();
						break;
					case 'nav_up':
						await sendNavKey('PageUp', 'UP');
						break;
					case 'nav_down':
						await sendNavKey('PageDown', 'DOWN');
						break;
					case 'nav_left':
						await sendNavKey('NavLeft', 'LEFT');
						break;
					case 'nav_right':
						await sendNavKey('NavRight', 'RIGHT');
						break;
					case 'nav_back':
						await sendNavKey('Escape', 'BACK');
						break;
					case 'nav_enter':
						await sendNavKey('Enter', 'SELECT');
						break;
					case 'type_keyboard':
						remoteTypingInput.focus({ preventScroll: true });
						break;
					case 'playback_prev':
						await sendPpvPlaybackControl('rewind', 'REWIND');
						break;
					case 'playback_toggle':
						await sendPpvPlaybackControl(
							ppvVideoPlaying && !ppvVideoPaused ? 'pause' : 'play',
							ppvVideoPlaying && !ppvVideoPaused ? 'PAUSE' : 'PLAY',
						);
						break;
					case 'playback_stop':
						await sendPpvPlaybackControl('stop', '⏹');
						break;
					case 'playback_next':
						await sendPpvPlaybackControl('fastForward', 'FAST FORWARD');
						break;
					case 'ch_up':
						display.textContent = 'CHANNEL UP';
						try {
							await window.fs42Api.get('player/channels/up');
							console.log('Channel up command sent');
							// The status polling will update the display with actual channel
						} catch (error) {
							console.error('Channel up failed:', error);
							display.textContent = 'ERROR';
							// Return to previous display after 2 seconds
							setTimeout(() => {
								display.textContent = idleDisplayText();
							}, 2000);
						}
						break;
					case 'ch_down':
						display.textContent = 'CHANNEL DOWN';
						try {
							await window.fs42Api.get('player/channels/down');
							console.log('Channel down command sent');
							// The status polling will update the display with actual channel
						} catch (error) {
							console.error('Channel down failed:', error);
							display.textContent = 'ERROR';
							// Return to previous display after 2 seconds
							setTimeout(() => {
								display.textContent = idleDisplayText();
							}, 2000);
						}
						break;
					case 'ch_prev':
						await tunePreviousChannel();
						break;
					case 'vol_up':
						try {
							const response = await window.fs42Api.get('player/volume/up');
							muted = muteStateFromResponse(response);
							showVolumeDisplay(response.volume || 'VOL +');
							console.log('Volume up command sent:', response);
						} catch (error) {
							console.error('Volume up failed:', error);
							showVolumeDisplay('ERROR');
						}
						break;
					case 'vol_down':
						try {
							const response = await window.fs42Api.get('player/volume/down');
							muted = muteStateFromResponse(response);
							showVolumeDisplay(response.volume || 'VOL -');
							console.log('Volume down command sent:', response);
						} catch (error) {
							console.error('Volume down failed:', error);
							showVolumeDisplay('ERROR');
						}
						break;
					case 'mute':
						const previousMuteState = muted;
						display.textContent = 'MUTE';
						try {
							const response = await window.fs42Api.get('player/volume/mute');
							muted = muteStateFromResponse(response, !previousMuteState);
							showVolumeDisplay(muted ? 'MUTE' : response.volume || 'MUTE OFF');
							console.log('Mute toggle command sent:', response);
						} catch (error) {
							console.error('Mute failed:', error);
							showVolumeDisplay('ERROR');
						}
						break;
					case 'guide':
						try {
							await window.fs42Api.post('player/channels/guide');
							display.textContent = 'GUIDE';
							console.log('Guide command sent');
						} catch (error) {
							console.error('Guide command failed:', error);
							display.textContent = 'ERROR';
						}
						break;
					case 'exit':
						display.textContent = 'EXIT';
						window.location.href = '/';
						break;
					case 'info':
						toggleInfoMode();
						break;
					case 'subtitles':
						await openMediaTrackPicker(false);
						return;
					case 'audio':
						await openMediaTrackPicker(true);
						return;
					default:
						display.textContent = key.toUpperCase();
				}

				// Reset display after 2 seconds for non-persistent states
				if (!['services_shutdown', 'services_restart', 'mute'].includes(key)) {
					setTimeout(() => {
						if (display.textContent !== 'OFF') {
							display.textContent = muted ? 'MUTE' : idleDisplayText();
						}
					}, 2000);
				}
			}

			// Initialize display and start polling
			display.textContent = idleDisplayText();
			// Don't show sample data, let the polling populate it
			nowPlayingNetwork.textContent = 'Loading...';
			nowPlayingStatus.textContent = '';
			nowPlayingTitle.textContent = '';
			startStatusPolling();

			// Clean up polling when page is unloaded
			window.addEventListener('beforeunload', stopStatusPolling);
		</script>
	</body>
</html>
